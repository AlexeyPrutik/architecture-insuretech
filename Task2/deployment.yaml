apiVersion: apps/v1
kind: Deployment
metadata:
  name: scalable-pod-identifier
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scalable-pod-identifier
  template:
    metadata:
      labels:
        app: scalable-pod-identifier
    spec:
      containers:
        - name: scalable-pod-identifier
          image: nginx:alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "16Mi"
              cpu: "50m"
            limits:
              memory: "30Mi"
              cpu: "200m"
